<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="310" viewBox="0 0 1120 310" role="img" aria-labelledby="title desc">
<title id="title">MiniCloud distributed job execution flow</title><desc id="desc">Client submits a job to coordinator, workers execute allowlisted tasks, PostgreSQL stores durable state.</desc>
<defs><linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171b1a"/><stop offset="1" stop-color="#0c0f0e"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.k{font:600 11px ui-monospace,monospace;letter-spacing:1.5px;fill:#8da697}.h{font:700 16px system-ui,sans-serif;fill:#f4f4ef}.s{font:12px system-ui,sans-serif;fill:#a5aaa4}.l{stroke:#53645a;stroke-width:1.5;fill:none;stroke-dasharray:5 7}.pkt{fill:#ed3426;filter:url(#g)}.pulse{animation:pulse 2s ease-in-out infinite}.move{animation:move 3.6s linear infinite}.move2{animation:move 3.6s linear infinite 1.2s}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes move{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(255px);opacity:0}}@media(prefers-reduced-motion:reduce){.pulse,.move,.move2{animation:none}}
</style></defs>
<rect x="1" y="1" width="1118" height="308" rx="18" fill="url(#p)" stroke="#303a34"/>
<text x="28" y="34" class="k">MINICLOUD / EXECUTION TOPOLOGY</text><text x="1090" y="34" text-anchor="end" class="s">COORDINATED · DURABLE · BOUNDED</text>
<path d="M225 154H370 M550 154H690 M870 154H960" class="l"/><path d="M225 154H370 M550 154H690 M870 154H960" stroke="#8da697" stroke-width="1" fill="none" stroke-dasharray="2 12" class="pulse"/>
<g transform="translate(36 92)"><rect width="190" height="124" rx="12" fill="#202723" stroke="#53645a"/><text x="18" y="28" class="k">01 / CLIENT</text><text x="18" y="57" class="h">CLI · mc</text><text x="18" y="80" class="s">Submit job payload</text><text x="18" y="99" class="s">Inspect state &amp; attempts</text><circle cx="166" cy="23" r="5" fill="#eda231" class="pulse"/></g>
<g transform="translate(370 78)"><rect width="180" height="152" rx="12" fill="#25302a" stroke="#8da697" stroke-width="1.5"/><text x="18" y="27" class="k">02 / CONTROL PLANE</text><text x="18" y="57" class="h">Coordinator</text><text x="18" y="80" class="s">HTTP API · domain FSM</text><text x="18" y="99" class="s">Dispatch · leases · retries</text><rect x="18" y="116" width="144" height="5" rx="3" fill="#45584b"/><rect x="18" y="116" width="92" height="5" rx="3" fill="#8da697" class="pulse"/></g>
<g transform="translate(690 70)"><rect width="180" height="168" rx="12" fill="#202723" stroke="#53645a"/><text x="18" y="25" class="k">03 / EXECUTION</text><text x="18" y="53" class="h">Worker pool</text><g transform="translate(18 70)"><rect width="62" height="56" rx="8" fill="#2b342e" stroke="#53645a"/><rect x="8" y="9" width="46" height="5" rx="2" fill="#8da697"/><text x="31" y="34" text-anchor="middle" class="s">W-01</text><circle cx="49" cy="45" r="3" fill="#8da697" class="pulse"/></g><g transform="translate(98 70)"><rect width="62" height="56" rx="8" fill="#2b342e" stroke="#53645a"/><rect x="8" y="9" width="46" height="5" rx="2" fill="#ed3426"/><text x="31" y="34" text-anchor="middle" class="s">W-02</text><circle cx="49" cy="45" r="3" fill="#ed3426" class="pulse"/></g><text x="18" y="149" class="s">Allowlisted tasks · bounded slots</text></g>
<g transform="translate(960 92)"><rect width="132" height="124" rx="12" fill="#202723" stroke="#53645a"/><text x="14" y="28" class="k">04 / STATE</text><text x="14" y="58" class="h">PostgreSQL</text><text x="14" y="81" class="s">Jobs · attempts</text><text x="14" y="100" class="s">Events · results</text><circle cx="111" cy="22" r="5" fill="#8da697" class="pulse"/></g>
<circle cx="245" cy="154" r="4" class="pkt move"/><circle cx="566" cy="154" r="4" class="pkt move2"/><circle cx="880" cy="154" r="4" class="pkt move"/>
<text x="28" y="278" class="s">Job lifecycle: SUBMITTED → QUEUED → RUNNING → SUCCEEDED / FAILED / RETRYING</text><text x="1090" y="278" text-anchor="end" class="k">POSTGRESQL 16 · GO</text></svg>